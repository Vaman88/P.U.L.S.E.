<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PULSE Morphing UI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: #F7F5F3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Geist', sans-serif;
    }

    #canvas {
      position: relative;
      width: 1440px;
      height: 1440px;
      background-color: #F7F5F3;
      transform-origin: center center;
      transform: scale(min(100vw/1440, 100vh/1440));
    }

    #shape {
      position: absolute;
      left: 720px;
      top: 720px;
      transform: translate(-50%, -50%);
      background-color: #0F766E;
      border-radius: 30px;
      width: 200px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      will-change: width, height, border-radius, background-color;
    }

    .content-layer {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      filter: blur(10px);
    }

    #content-button { font-weight: 500; font-size: 20px; }
    #content-dropzone { color: #475569; border: 3px dashed #CBD5E1; border-radius: inherit; width: 100%; height: 100%; display: flex; flex-direction: column; gap: 16px; }
    #content-loader { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; }
    #content-chart { color: #0f172a; padding: 32px; width: 100%; height: 100%; align-items: flex-start; justify-content: flex-start; flex-direction: column; box-sizing: border-box; }
    #content-toast { color: white; font-weight: 500; font-size: 18px; }

    #cursor {
      position: absolute;
      width: 32px;
      height: 32px;
      left: 720px;
      top: 720px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="2"><polygon points="3 3 10 21 14 14 21 10 3 3"/></svg>');
      background-size: contain;
      pointer-events: none;
      z-index: 100;
      will-change: transform;
    }
  </style>
</head>
<body>

<div id="canvas">
  <div id="shape">
    <div id="content-button" class="content-layer">Train Workspace</div>
    <div id="content-dropzone" class="content-layer"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg><span style="font-weight:500">Drop sales_history.csv</span></div>
    <div id="content-loader" class="content-layer"></div>
    <div id="content-chart" class="content-layer"><h3 style="margin:0;font-size:24px;font-family:serif;">Demand Forecast</h3><div id="chart-line" style="margin-top:20px;width:100%;height:100%;border-bottom:2px solid #e2e8f0;border-left:2px solid #e2e8f0;position:relative;"></div></div>
    <div id="content-toast" class="content-layer">Plan updated</div>
  </div>
  <div id="cursor"></div>
</div>

<script>
  function stepResponse(t, t0, omega = 15) {
    if (t < t0) return 0;
    const dt = t - t0;
    return 1 - Math.exp(-omega * dt) * (1 + omega * dt);
  }

  function evaluateTimeline(t, initial, changes, omega = 15) {
    let value = initial;
    for (let i = 0; i < changes.length; i++) {
      const prevTarget = i === 0 ? initial : changes[i-1].val;
      const step = changes[i].val - prevTarget;
      value += step * stepResponse(t, changes[i].t, changes[i].omega || omega);
    }
    return value;
  }

  const BEAT = 0.5;
  const LOOP_DURATION = 14.0;

  const COLOR_TEAL = [15, 118, 110];
  const COLOR_WHITE = [255, 255, 255];
  const COLOR_BLACK = [15, 23, 42];

  const shapeWidth = [
    { t: 3*BEAT, val: 400 },
    { t: 8*BEAT, val: 100 },
    { t: 12*BEAT, val: 600 },
    { t: 22*BEAT, val: 300 },
    { t: 26*BEAT, val: 200 }
  ];

  const shapeHeight = [
    { t: 3*BEAT, val: 300 },
    { t: 8*BEAT, val: 100 },
    { t: 12*BEAT, val: 400 },
    { t: 22*BEAT, val: 60 },
    { t: 26*BEAT, val: 60 }
  ];

  const shapeRadius = [
    { t: 3*BEAT, val: 20 },
    { t: 8*BEAT, val: 50 },
    { t: 12*BEAT, val: 20 },
    { t: 22*BEAT, val: 12 },
    { t: 26*BEAT, val: 30 }
  ];

  const shapeR = [
    { t: 3*BEAT, val: COLOR_WHITE[0] },
    { t: 8*BEAT, val: COLOR_TEAL[0] },
    { t: 12*BEAT, val: COLOR_WHITE[0] },
    { t: 22*BEAT, val: COLOR_BLACK[0] },
    { t: 26*BEAT, val: COLOR_TEAL[0] }
  ];
  const shapeG = [
    { t: 3*BEAT, val: COLOR_WHITE[1] },
    { t: 8*BEAT, val: COLOR_TEAL[1] },
    { t: 12*BEAT, val: COLOR_WHITE[1] },
    { t: 22*BEAT, val: COLOR_BLACK[1] },
    { t: 26*BEAT, val: COLOR_TEAL[1] }
  ];
  const shapeB = [
    { t: 3*BEAT, val: COLOR_WHITE[2] },
    { t: 8*BEAT, val: COLOR_TEAL[2] },
    { t: 12*BEAT, val: COLOR_WHITE[2] },
    { t: 22*BEAT, val: COLOR_BLACK[2] },
    { t: 26*BEAT, val: COLOR_TEAL[2] }
  ];

  const layers = {
    'button': [ {t: 3*BEAT, val: 0}, {t: 26*BEAT, val: 1} ],
    'dropzone': [ {t: 3*BEAT, val: 1}, {t: 8*BEAT, val: 0} ],
    'loader': [ {t: 8*BEAT, val: 1}, {t: 12*BEAT, val: 0} ],
    'chart': [ {t: 12*BEAT, val: 1}, {t: 22*BEAT, val: 0} ],
    'toast': [ {t: 22*BEAT, val: 1}, {t: 26*BEAT, val: 0} ]
  };

  const cursorX = [
    { t: 1*BEAT, val: 720 },
    { t: 4*BEAT, val: 900 },
    { t: 6*BEAT, val: 720 },
    { t: 10*BEAT, val: 720 },
    { t: 14*BEAT, val: 450 },
    { t: 17*BEAT, val: 950 },
    { t: 20*BEAT, val: 720 },
    { t: 27*BEAT, val: 800 },
    { t: 28*BEAT, val: 800 }
  ];

  const cursorY = [
    { t: 1*BEAT, val: 740 },
    { t: 4*BEAT, val: 200 },
    { t: 6*BEAT, val: 720 },
    { t: 10*BEAT, val: 720 },
    { t: 14*BEAT, val: 720 },
    { t: 17*BEAT, val: 720 },
    { t: 20*BEAT, val: 740 },
    { t: 27*BEAT, val: 900 },
    { t: 28*BEAT, val: 900 }
  ];

  const cursorScale = [
    { t: 2*BEAT, val: 0.8, omega: 40 },
    { t: 2.5*BEAT, val: 1, omega: 40 },
    { t: 5*BEAT, val: 0.8, omega: 40 },
    { t: 6.5*BEAT, val: 1, omega: 40 },
    { t: 14*BEAT, val: 0.8, omega: 40 },
    { t: 17*BEAT, val: 1, omega: 40 },
    { t: 21.5*BEAT, val: 0.8, omega: 40 },
    { t: 22*BEAT, val: 1, omega: 40 },
  ];

  const elShape = document.getElementById('shape');
  const elCursor = document.getElementById('cursor');
  const elContent = {
    'button': document.getElementById('content-button'),
    'dropzone': document.getElementById('content-dropzone'),
    'loader': document.getElementById('content-loader'),
    'chart': document.getElementById('content-chart'),
    'toast': document.getElementById('content-toast')
  };

  function seek(time) {
    const t = time % LOOP_DURATION;

    const w = evaluateTimeline(t, 200, shapeWidth);
    const h = evaluateTimeline(t, 60, shapeHeight);
    const r = evaluateTimeline(t, 30, shapeRadius);

    const cr = Math.round(evaluateTimeline(t, COLOR_TEAL[0], shapeR));
    const cg = Math.round(evaluateTimeline(t, COLOR_TEAL[1], shapeG));
    const cb = Math.round(evaluateTimeline(t, COLOR_TEAL[2], shapeB));

    elShape.style.width = `${w}px`;
    elShape.style.height = `${h}px`;
    elShape.style.borderRadius = `${r}px`;
    elShape.style.backgroundColor = `rgb(${cr}, ${cg}, ${cb})`;

    if (cr > 200) {
      elShape.style.boxShadow = '0 0 0 1px #E2E8F0, 0 10px 15px -3px rgba(0,0,0,0.1)';
    } else {
      elShape.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';
    }

    const cx = evaluateTimeline(t, 800, cursorX);
    const cy = evaluateTimeline(t, 900, cursorY);
    const cs = evaluateTimeline(t, 1, cursorScale);
    elCursor.style.transform = `translate(${cx}px, ${cy}px) scale(${cs})`;

    for (const key in layers) {
      const initialOpacity = key === 'button' ? 1 : 0;
      const opacity = evaluateTimeline(t, initialOpacity, layers[key], 30);
      const blur = (1 - Math.max(0, Math.min(1, opacity))) * 10;

      elContent[key].style.opacity = opacity;
      elContent[key].style.filter = `blur(${blur}px)`;
      elContent[key].style.pointerEvents = opacity < 0.1 ? 'none' : 'auto';
    }

    if (t > 8*BEAT && t < 12*BEAT) {
      const rot = (t * 360) % 360;
      elContent['loader'].style.transform = `rotate(${rot}deg)`;
    } else {
      elContent['loader'].style.transform = `none`;
    }
  }

  window.seek = seek;

  const startTime = performance.now() / 1000;
  function tick() {
    const t = performance.now() / 1000 - startTime;
    seek(t);
    requestAnimationFrame(tick);
  }
  tick();

</script>
</body>
</html>
